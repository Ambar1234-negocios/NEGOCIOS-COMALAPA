<!DOCTYPE html>
<html lang="es">

<!-- ============================================================
   HEAD / CONFIGURACIÓN DEL DOCUMENTO
============================================================ -->

<head>

  <!-- ============================================================
     GOOGLE ANALYTICS
  ============================================================ -->

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NSLXHCBFQ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NSLXHCBFQ3');
  </script>

  <!-- ============================================================
     META DATOS Y ARCHIVOS
  ============================================================ -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exhibición Frontera Comalapa</title>
  <link rel="stylesheet" href="style.css?v=8">

</head>

<body>

  <!-- ============================================================
     PORTADA PRINCIPAL / HERO
  ============================================================ -->

  <header class="hero">
    <div class="overlay">
      <h1>Exhibición<br>Frontera Comalapa</h1>
      <p>Encuentra negocios y servicios de confianza en un solo lugar</p>
    </div>
  </header>


  <!-- ============================================================
     BUSCADOR
  ============================================================ -->

  <div class="buscador-contenedor">
    <input
      type="text"
      id="buscador"
      placeholder="🔍 Buscar negocio, servicio o plataforma..."
      onkeydown="if(event.key==='Enter'){buscarNegocios();}"
    >
  </div>


  <!-- ============================================================
     ANUNCIO PRINCIPAL
  ============================================================ -->

  <section id="compras-encargo" class="compras-encargo" aria-label="Compras por encargo" hidden></section>

  <section id="anuncio-principal" class="anuncio-principal oculto" aria-label="Anuncio principal">
    <div id="anuncio-principal-contenido" class="anuncio-principal-contenido"></div>
  </section>


  <!-- ============================================================
     NEGOCIOS DESTACADOS / CARRUSEL
  ============================================================ -->

  <section class="destacados" aria-label="Promociones destacadas">
    <div class="carrusel-destacados"></div>
  </section>


  <!-- ============================================================
     CATEGORÍAS
  ============================================================ -->

  <section id="categorias" class="categorias">
    <h2>Categorías</h2>

    <div class="grid-categorias">
      <button class="categoria categoria-premium" onclick="mostrarCategoria('streaming')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v13H3z M8 21h8 M12 17v4"/></svg>Streaming y Tecnología</button>
      <button class="categoria" onclick="mostrarCategoria('construccion')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V7l9-4 9 4v14 M7 10h2m6 0h2M7 14h2m6 0h2M10 21v-4h4v4"/></svg>Construcción y Materiales</button>
      <button class="categoria" onclick="mostrarCategoria('comida')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v7m-3-7v5q0 3 3 3t3-3V3M6 11v10M18 3v18m0-18q-5 5 0 9"/></svg>Comida y Restaurantes</button>
      <button class="categoria" onclick="mostrarCategoria('salud')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>Salud y Farmacias</button>
      <button class="categoria" onclick="mostrarCategoria('hoteles')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V3m0 12h18v6m-18-6V8h7v7m0-5h8q3 0 3 3v2"/></svg>Hoteles y Hospedaje</button>
      <button class="categoria" onclick="mostrarCategoria('automotriz')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16V9l3-5h12l3 5v7zM3 10h18M6 16v4m12-4v4M6 13h2m8 0h2"/></svg>Talleres y Refacciones</button>
      <button class="categoria" onclick="mostrarCategoria('servicios')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg>Servicios para el Hogar</button>
      <button class="categoria" onclick="mostrarCategoria('belleza')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 18M19 3L5 21M7 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0M23 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></svg>Belleza y Estética</button>
      <button class="categoria" onclick="mostrarCategoria('mandaditos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h13v12H2zM15 10h4l3 4v3h-7M8 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0M21 19a2 2 0 1 1-4 0 2 2 0 0 1 4 0"/></svg>Mandaditos</button>
      <button class="categoria" onclick="mostrarCategoria('comercios')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l2-6h14l2 6M3 9q3 4 6 0 3 4 6 0 3 4 6 0M4 12v9h16v-9M9 21v-7h6v7"/></svg>Comercios</button>
      <button class="categoria" onclick="mostrarCategoria('profesionales')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v14H3zM8 7V3h8v4M3 12h18M10 12v3h4v-3"/></svg>Profesionistas</button>
      <button class="categoria" onclick="mostrarCategoria('bienesraices')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg>Casas y Terrenos</button>
      <button class="categoria" onclick="mostrarCategoria('veterinarias')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14q4-5 8 0t0 7H8q-4-2 0-7M5 7v2m5-6v3m4-3v3m5 1v2"/></svg>Veterinarias</button>
      <button class="categoria" onclick="mostrarCategoria('agua')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2Q1 14 6 19q6 6 12 0Q23 14 12 2z"/></svg>Purificadoras de Agua</button>
    </div>
  </section>


  <!-- ============================================================
     RESULTADOS / LISTA DE NEGOCIOS
  ============================================================ -->

  <section class="resultado">
    <h2 id="titulo-categoria">Selecciona una categoría</h2>
    <div id="lista-negocios" class="cards"></div>
  </section>


  <!-- ============================================================
     REGISTRO DE NEGOCIO
  ============================================================ -->

  <section class="registro">
    <h2>¿Tienes un negocio?</h2>
    <p>Registra tu negocio en Exhibición Frontera Comalapa y llega a más clientes.</p>

    <a href="https://wa.me/529633106862?text=Hola,%20quiero%20registrar%20mi%20negocio%20en%20Exhibición%20Frontera%20Comalapa" class="btn-registro">
      Registrar mi negocio
    </a>
  </section>


  <!-- ============================================================
     FOOTER / PIE DE PÁGINA
  ============================================================ -->

  <footer>
    <p>© 2026 Exhibición Frontera Comalapa</p>
  </footer>


  <!-- ============================================================
     ARCHIVO JAVASCRIPT
  ============================================================ -->

  <script src="contactos.js?v=1"></script>
  <script src="categorias.js?v=1"></script>
  <script src="script.js?v=9"></script>

</body>
</html>
