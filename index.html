<!DOCTYPE html>
<html lang="es">

<!-- ============================================================
   HEAD / CONFIGURACIÓN DEL DOCUMENTO
============================================================ -->

<head>

  <!-- ============================================================
     GOOGLE ANALYTICS
  ============================================================ -->

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NSLXHCBFQ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NSLXHCBFQ3');
  </script>

  <!-- ============================================================
     META DATOS Y ARCHIVOS
  ============================================================ -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exhibición Frontera Comalapa</title>
  <link rel="stylesheet" href="style.css?v=7">

</head>

<body>

  <!-- ============================================================
     PORTADA PRINCIPAL / HERO
  ============================================================ -->

  <header class="hero">
    <div class="overlay">
      <h1>Exhibición<br>Frontera Comalapa</h1>
      <p>Encuentra negocios y servicios de confianza en un solo lugar</p>
    </div>
  </header>


  <!-- ============================================================
     BUSCADOR
  ============================================================ -->

  <div class="buscador-contenedor">
    <input
      type="text"
      id="buscador"
      placeholder="🔍 Buscar negocio, servicio o plataforma..."
      onkeydown="if(event.key==='Enter'){buscarNegocios();}"
    >
  </div>


  <!-- ============================================================
     NEGOCIOS DESTACADOS / CARRUSEL
  ============================================================ -->

  <section class="destacados" aria-label="Promociones destacadas">
    <div class="carrusel-destacados"></div>
  </section>


  <!-- ============================================================
     CATEGORÍAS
  ============================================================ -->

  <section id="categorias" class="categorias">
    <h2>📍 Categorías</h2>

    <div class="grid-categorias">
      <button class="categoria categoria-premium" onclick="mostrarCategoria('streaming')">📺 Streaming y Tecnología</button>
      <button class="categoria" onclick="mostrarCategoria('construccion')">🏗️ Construcción y Materiales</button>
      <button class="categoria" onclick="mostrarCategoria('comida')">🍔 Comida y Restaurantes</button>
      <button class="categoria" onclick="mostrarCategoria('salud')">🏥 Salud y Farmacias</button>
      <button class="categoria" onclick="mostrarCategoria('hoteles')">🏨 Hoteles y Hospedaje</button>
      <button class="categoria" onclick="mostrarCategoria('automotriz')">🚗 Talleres y Refacciones</button>
      <button class="categoria" onclick="mostrarCategoria('servicios')">🛠️ Servicios para el Hogar</button>
      <button class="categoria" onclick="mostrarCategoria('belleza')">💇 Belleza y Estética</button>
      <button class="categoria" onclick="mostrarCategoria('mandaditos')">🚚 Mandaditos</button>
      <button class="categoria" onclick="mostrarCategoria('comercios')">🛒 Comercios</button>
      <button class="categoria" onclick="mostrarCategoria('profesionales')">👔 Profesionistas</button>
      <button class="categoria" onclick="mostrarCategoria('bienesraices')">🏡 Casas y Terrenos</button>
      <button class="categoria" onclick="mostrarCategoria('veterinarias')">🐶 Veterinarias</button>
      <button class="categoria" onclick="mostrarCategoria('agua')">💧 Purificadoras de Agua</button>
    </div>
  </section>


  <!-- ============================================================
     RESULTADOS / LISTA DE NEGOCIOS
  ============================================================ -->

  <section class="resultado">
    <h2 id="titulo-categoria">Selecciona una categoría</h2>
    <div id="lista-negocios" class="cards"></div>
  </section>


  <!-- ============================================================
     REGISTRO DE NEGOCIO
  ============================================================ -->

  <section class="registro">
    <h2>¿Tienes un negocio?</h2>
    <p>Registra tu negocio en Exhibición Frontera Comalapa y llega a más clientes.</p>

    <a href="https://wa.me/529633106862?text=Hola,%20quiero%20registrar%20mi%20negocio%20en%20Exhibición%20Frontera%20Comalapa" class="btn-registro">
      Registrar mi negocio
    </a>
  </section>


  <!-- ============================================================
     FOOTER / PIE DE PÁGINA
  ============================================================ -->

  <footer>
    <p>© 2026 Exhibición Frontera Comalapa</p>
  </footer>


  <!-- ============================================================
     ARCHIVO JAVASCRIPT
  ============================================================ -->

  <script src="script.js?v=7"></script>

</body>
</html>
